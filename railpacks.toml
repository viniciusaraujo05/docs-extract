[phases.setup]
nixPkgs = ['imagemagick', 'ghostscript', 'php85Extensions.imagick']
aptPkgs = ['imagemagick', 'ghostscript', 'libmagickwand-dev']

[start]
cmd = "mkdir -p ~/.magick ~/.config/ImageMagick && cp .railway/policy.xml ~/.magick/policy.xml && cp .railway/policy.xml ~/.config/ImageMagick/policy.xml && php artisan serve --host=0.0.0.0 --port=$PORT"
